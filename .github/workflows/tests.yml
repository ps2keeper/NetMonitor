name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -t . -v
      - name: Lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes monitor.py mini_widget.py nm_config.py nm_windows.py storage.py collector.py web.py create_shortcuts.py
